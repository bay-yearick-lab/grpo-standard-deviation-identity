[project]
name = "grpo-standard-deviation-identity"
version = "0.1.0"
description = "GRPO, Dr. GRPO, and DAPO are three operations on one number: the group-standard-deviation identity"
license = { text = "MIT" }
authors = [
    { name = "Yong Yi Bay" },
    { name = "Kathleen A. Yearick" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "huggingface-hub>=0.24",
]

[project.urls]
Repository = "https://github.com/bay-yearick-lab/grpo-standard-deviation-identity"
Homepage = "https://github.com/bay-yearick-lab/grpo-standard-deviation-identity"

[tool.uv]
package = false
